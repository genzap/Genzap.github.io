<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfit test</title>
<style>
body{font:15px/1.5 Inter,system-ui,sans-serif;background:#FAF7F1;color:#1C1812;margin:0;padding:16px;max-width:520px;margin:auto}
h1{font:500 22px Georgia,serif;margin:0 0 4px}.s{color:#6E6659;font-size:13px;margin:0 0 14px}
.box{background:#fff;border:1px solid #E9E1D3;border-radius:14px;padding:12px;margin-bottom:12px}
label{font-weight:600;font-size:13px;display:block;margin-bottom:6px}
button{background:#E8930C;color:#1C1812;border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;margin:4px 6px 0 0}
button:disabled{opacity:.5}img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#6E6659;margin:6px 0 0}
</style></head><body>
<h1>Outfit Checker test</h1>
<p class="s">Ye Mesh API credits use karta hai (Genzap credits nahi). Har button ek hi call karta hai.</p>
<div class="box"><label>1. Person photo</label><input type="file" id="p" accept="image/*"><img id="pp"></div>
<div class="box"><label>2. Clothing photo</label><input type="file" id="c" accept="image/*"><img id="cp"></div>
<div class="box"><label>Model ID (Mesh model string)</label>
<input id="m" value="xai/grok-imagine" style="width:100%;padding:10px;border:1px solid #E9E1D3;border-radius:10px;font-size:14px;box-sizing:border-box">
<p class="s" style="margin:6px 0 0">Mesh ki model list se copy karo, jaise Nano Banana 2, FLUX.2 Pro, FLUX Kontext Pro, Seedream 5.</p></div>
<div class="box"><label>Run one method</label>
<button onclick="run('A')">A: mix (raw base64)</button>
<button onclick="run('B')">B: mix (data URL)</button>
<button onclick="run('C')">C: collage edit</button></div>
<div id="out"></div>
<script>
const W='https://genzap-image.genzap01.workers.dev';
const $=id=>document.getElementById(id);
function load(f){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)})}
async function small(f,max=1024){const i=await load(f),k=Math.min(1,max/Math.max(i.width,i.height));
 const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.9)}
async function collage(a,b){const [x,y]=await Promise.all([load(a),load(b)]),H=900;
 const wa=x.width*H/x.height,wb=y.width*H/y.height,c=document.createElement('canvas');c.width=Math.round(wa+wb);c.height=H;
 const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,H);g.drawImage(x,0,0,wa,H);g.drawImage(y,wa,0,wb,H);return c.toDataURL('image/jpeg',.9)}
$('p').onchange=e=>$('pp').src=URL.createObjectURL(e.target.files[0]);
$('c').onchange=e=>$('cp').src=URL.createObjectURL(e.target.files[0]);
const TWO='Image 1 is a person. Image 2 is a clothing item. Create one photo of the person from image 1 wearing exactly the clothing from image 2 (same color, pattern, collar, buttons, sleeves). Keep the face, identity and body the same. Standing front pose, photorealistic.';
const COL='The input is two photos side by side. LEFT: a person. RIGHT: a clothing item. Output ONE photo only: the same person from the left (same face and body) wearing exactly the clothing shown on the right (same color, pattern, collar, buttons). Do not show the side-by-side layout and do not include the clothing photo.';
async function run(m){
 const pf=$('p').files[0],cf=$('c').files[0];if(!pf||!cf){alert('Dono photos chuno');return}
 const box=document.createElement('div');box.className='box';box.innerHTML='<b>Method '+m+' · '+$('m').value.trim()+'</b><pre>Running...</pre>';$('out').prepend(box);
 const t=Date.now();document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{
  const pd=await small(pf),cd=await small(cf),raw=d=>d.split(',')[1];let body;
  if(m==='A')body={prompt:TWO,model:$('m').value.trim(),operation:'mix',image:raw(pd),reference_images:[raw(cd)]};
  if(m==='B')body={prompt:TWO,model:$('m').value.trim(),operation:'mix',image:pd,reference_images:[cd]};
  if(m==='C')body={prompt:COL,model:$('m').value.trim(),operation:'edit',image:raw(await collage(pf,cf))};
    const r=await fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){}
  const it=j&&j.data&&j.data[0],src=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
  box.querySelector('pre').textContent='HTTP '+r.status+' · '+((Date.now()-t)/1000).toFixed(1)+'s'+(src?'':'\n'+txt.slice(0,400));
  if(src){const im=new Image();im.src=src;box.appendChild(im)}
 }catch(e){box.querySelector('pre').textContent='Error: '+e.message}
 document.querySelectorAll('button').forEach(b=>b.disabled=false);
}
</script></body></html>
